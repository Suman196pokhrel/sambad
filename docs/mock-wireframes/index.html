<!doctype html>
<!--
  Sambad clickable mock: entry page.
  Open this file directly in a browser (no server, no build). It loads the
  seeded demo data (data.js) and the behaviour (app.js), which renders every
  screen into #app. A throwaway prototype for feeling out the product before
  the real Vite + FastAPI build; nothing here is production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sambad Mock</title>
<link rel="icon" href="../imgs/sambad-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="demo"></div>
<button class="demo-fab" data-act="demo" data-menu>Demo</button>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
